[package]
name = "tay"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Topology Automation via YAML: brings a stack of host processes and containers up in dependency order and tells the truth about its state"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["orchestration", "dev-environment", "containers", "processes", "yaml"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
base64ct = { version = "1.6", features = ["alloc"] }
http-body-util = { version = "0.1.3", features = ["channel"] }
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rsa = "0.9"
rustix = { version = "1", features = ["fs", "net", "process", "stdio"] }
saphyr-parser = "0.3.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }

# When a process started, which tells a process tay recorded from another
# given its number later. macOS says so only through libproc, which rustix
# does not wrap; libc is already built for rustix and tokio there.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

# A key pair's primes are found by this crate's arithmetic, which without
# optimization takes seconds for one RSA key; the tests make several.
[profile.dev.package.num-bigint-dig]
opt-level = 3

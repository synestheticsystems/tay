[package]
name = "tay"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Topology Automation via YAML: brings a stack of host processes and containers up in dependency order and tells the truth about its state"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["orchestration", "dev-environment", "containers", "processes", "yaml"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }
rustix = { version = "1", features = ["fs", "net", "process"] }
saphyr-parser = "0.3.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

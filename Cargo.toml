[package]
name = "tay"
version = "0.2.2"
edition = "2024"
rust-version = "1.93"
description = "Topology Automation via YAML: brings a stack of host processes and containers up in dependency order and tells the truth about its state"
license = "MIT OR Apache-2.0"
repository = "https://github.com/synestheticsystems/tay"
readme = "README.md"
keywords = ["orchestration", "dev-environment", "containers", "processes", "yaml"]
categories = ["command-line-utilities", "development-tools"]
# What the published crate leaves out: how the repository itself is built and
# released, which project in its tracker it belongs to, and the README's
# picture, which the README names by its public address.
exclude = [".github/", ".fwd/", "docs/assets/"]

[dependencies]
base64ct = { version = "1.6", features = ["alloc"] }
# Docker's API, over its local socket alone: no TLS, no SSH, no BuildKit
# session.
bollard = { version = "0.21.1", default-features = false, features = ["pipe"] }
# What bollard answers in, a stream, is read through this crate's
# `StreamExt`, which bollard is built on.
futures-util = { version = "0.3", default-features = false }
http-body-util = { version = "0.1.3", features = ["channel"] }
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# What changed among the files a unit watches, as the system says it:
# FSEvents on macOS and inotify on Linux, so that nothing is looked at while
# nothing changes. The standard library has neither, and FSEvents is had
# only through the system's own frameworks.
notify = "8.2"
rand_core = { version = "0.6", features = ["getrandom"] }
rsa = "0.9"
rustix = { version = "1", features = ["fs", "net", "process", "stdio"] }
saphyr-parser = "0.3.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The digests that what a unit was started from is kept as, a secret's
# among them, which no one must be able to read back: the standard library
# has no such hash.
sha2 = "0.10"
thiserror = "2"
# `signal`: `tay serve` is told to stop by a signal, which the daemon's
# runtime must hear without blocking; it adds no crate tokio's `process`
# does not already bring.
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }

# When a process started, which tells a process tay recorded from another
# given its number later. macOS says so only through libproc, which rustix
# does not wrap; libc is already built for rustix and tokio there.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

# A key pair's primes are found by this crate's arithmetic, which without
# optimization takes seconds for one RSA key; the tests make several.
[profile.dev.package.num-bigint-dig]
opt-level = 3

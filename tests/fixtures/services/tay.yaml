format: 1
stack: services
up: [web]
units:
  api:
    doc: Takes two seconds to be ready, and says so in its log.
    uses: process
    with: { command: ["${environment.root}/services/slow.sh", "2"] }
    ready: { log: listening, within: 20s }
  web:
    doc: Waits for the API, then ticks for ever.
    uses: process
    needs: [api]
    with: { command: ["${environment.root}/services/ticker.sh"] }
  broken:
    doc: Fails at once, every time, before it is ready.
    uses: process
    with: { command: ["${environment.root}/services/fails.sh"] }
    ready: { log: configured, within: 5s }
    restart: { on: failure, attempts: 2 }
  quitter:
    doc: Exits with 7 two seconds after it starts.
    uses: process
    with: { command: ["${environment.root}/services/exits.sh", "2", "7"] }
    restart: { on: failure, attempts: 3 }
  once:
    doc: Exits with 7 two seconds after it starts, and is not started again.
    uses: process
    with: { command: ["${environment.root}/services/exits.sh", "2", "7"] }
    restart: { on: never }
  stubborn:
    doc: Ignores SIGTERM, and so do the processes it starts.
    uses: process
    with: { command: ["${environment.root}/services/stubborn.sh"] }
  spawner:
    doc: Starts two processes of its own and waits.
    uses: process
    with: { command: ["${environment.root}/services/spawner.sh"] }
  never-ready:
    doc: Runs, and never writes the line it is waited for by.
    uses: process
    with: { command: ["${environment.root}/services/ticker.sh"] }
    ready: { log: "never written", within: 2s }
    restart: { on: failure, attempts: 2 }
  ticks-port: { uses: port }
  ticking:
    doc: Ticks, once its port is held.
    uses: process
    with: { command: ["${environment.root}/services/ticker.sh", "${ticks-port.number}"] }
  reporter:
    doc: Says the folder it runs in and every variable it was given, and waits.
    uses: process
    with:
      command: ["${environment.root}/services/report.sh"]
      workdir: "${environment.state}"
      env: { MODE: fast }
      inherit: [PATH]
  reported:
    doc: The same, run once as a command, which inherits what a process does when `inherit` does not say.
    uses: command
    with: { run: ["${environment.root}/services/report.sh", "once"] }

format: 1
stack: paths
up: [web, box, conf, named-conf]
settings:
  port: { default: 8080 }
  conf_name: { default: site }
  config_folder: { default: ./config }
units:
  build:
    uses: command
    with: { run: [build], outputs: { server: target/debug/server } }
  box:
    uses: container
    with:
      image: example/box
      mounts:
        - { from: config, to: /config }
        - { from: "${environment.state}/box", to: /state }
        - { from: "${environment.logs}/box", to: /logs }
        - { from: "${environment.shared}/cache", to: /cache }
        - { from: "${build.outputs.server}", to: /server }
  lost:
    uses: container
    with:
      image: example/lost
      mounts: [{ from: ./missing, to: /missing }]
  named-conf:
    uses: file
    with:
      template: "${environment.root}/stack/units/conf/site.conf.tmpl"
      name: "${settings.conf_name}.conf"
  forgetful:
    uses: process
    with: { command: [work] }
    watch: [./nothing-here]

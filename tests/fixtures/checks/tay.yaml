format: 1
stack: checks
up: [site]
settings:
  fixed: { type: number }
units:
  site-port: { uses: port }
  site:
    doc: Answers 200 at /health while its folder has a file `healthy`, and 503 when not, at the address its own check uses.
    uses: process
    with:
      command: ["python3", "${environment.root}/services/serve.py", "${site-port.number}", "${host.listen}"]
      workdir: "${environment.state}"
      prepare: [["${environment.root}/services/mark.sh", "${environment.state}/healthy"]]
    ready: { http: "${self.web.url}/health", within: 20s }
    gives:
      web: { port: "${site-port.number}", scheme: http }
  listener:
    doc: The same server, ready once a connection opens.
    uses: process
    with:
      command: ["python3", "${environment.root}/services/serve.py", "${listener-port.number}"]
    ready: { tcp: "127.0.0.1:${listener-port.number}", within: 20s }
  listener-port: { uses: port }
  probed:
    doc: Ready when a command it is checked by exits 0.
    uses: process
    with:
      command: ["${environment.root}/services/slow.sh", "1"]
      env: { READY_FILE: "${environment.state}/probed-ready" }
    ready: { command: ["${environment.root}/services/is-ready.sh", "${environment.state}/probed-ready"], within: 20s }
  secure-port: { uses: port }
  secure:
    doc: Checked over https, which tay cannot do yet.
    uses: process
    with:
      command: ["python3", "${environment.root}/services/serve.py", "${secure-port.number}"]
    ready: { http: "https://127.0.0.1:${secure-port.number}/health", within: 3s }
    restart: { on: never }
  brief-port: { uses: port }
  brief:
    doc: Ready by an http check that is allowed eight seconds.
    uses: process
    with:
      command: ["python3", "${environment.root}/services/serve.py", "${brief-port.number}"]
      workdir: "${environment.state}"
      prepare: [["${environment.root}/services/mark.sh", "${environment.state}/healthy"]]
    ready: { http: "http://127.0.0.1:${brief-port.number}/health", within: 8s }
  fixed-port: { uses: port, with: { fixed: "${settings.fixed}" } }
  pinned:
    doc: Listens on a port that must be had.
    uses: process
    with:
      command: ["python3", "${environment.root}/services/serve.py", "${fixed-port.number}"]
    ready: { tcp: "127.0.0.1:${fixed-port.number}", within: 20s }
  hanging:
    doc: Checked by a command that never ends.
    uses: process
    with: { command: ["${environment.root}/services/slow.sh", "300"] }
    ready: { command: ["${environment.root}/services/hang.sh"], within: 1m }
  conf-port: { uses: port }
  conf:
    doc: Says which port the reader listens on.
    uses: file
    with: { content: "${conf-port.number}\n" }
  reader:
    doc: Listens on the port its file says, using the port only through the file.
    uses: process
    with:
      command: ["python3", "${environment.root}/services/serve.py", "@${conf.path}"]
    ready: { log: serving, within: 20s }

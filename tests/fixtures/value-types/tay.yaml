format: 1
stack: value-types
settings:
  port: { default: 8080 }
  verbose: { default: true }
  pattern: { default: "${not.a.reference} and $${this}" }
units:
  fixed-port:
    uses: port
    with: { fixed: "${settings.port}" }
    gives:
      whole: "${settings.port}"
      inside: "port ${settings.port}"
      flag: "${settings.verbose}"
      escaped: "$${settings.port} stays as written"
      name: "${environment.name}"
      label: "${environment.label}"
      profile: "${environment.profile}"
      state: "${environment.state}"
      id: "${environment.id}"
      listen: "${host.listen}"
      pattern: "${settings.pattern}"

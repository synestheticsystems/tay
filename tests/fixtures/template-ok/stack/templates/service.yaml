params:
  env: { default: {} }
  command: { default: [serve] }
  ready: { default: { log: started, within: 1m } }
  watch: { default: [] }
unit:
  with: { env: "${params.env}" }
  ready: "${params.ready}"
  watch: "${params.watch}"
  run:
    source:
      uses: process
      with: { command: "${params.command}", env: { LEVEL: debug } }
    image:
      uses: container
      with: { image: example/service }

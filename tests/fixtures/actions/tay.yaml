format: 1
stack: actions
default_profile: dev
units:
  seed:
    uses: command
    action: true
    with: { run: [seed] }
  logger: { uses: port }
  app:
    uses: port
    after: [logger]
  needs-seed: { uses: port, needs: [seed] }
  mint:
    uses: command
    action: true
    args:
      user: {}
      hours: { default: 8 }
    with: { run: [mint, --user, "${args.user}", --hours, "${args.hours}"] }
    gives: { user: "${args.user}", hours: "${args.hours}" }

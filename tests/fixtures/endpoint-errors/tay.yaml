format: 1
stack: endpoint-errors
units:
  hidden:
    uses: container
    with: { image: example/db }
    gives:
      db: { port: 5432 }
  host-user:
    uses: process
    with:
      command: [use]
      env: { DB: "${hidden.db}", DB_NET: "${hidden.db@net}" }
  box-user:
    uses: container
    with:
      image: example/user
      env: { DB: "${hidden.db}", DB_HOST: "${hidden.db@host}" }
  config:
    uses: file
    with: { content: "db = ${hidden.db}" }
  also-hidden:
    uses: container
    with: { image: example/other }
    gives:
      db: { port: 6543 }
  both-user:
    uses: process
    with: { command: [use, "${hidden.db} and ${also-hidden.db}"] }
  badge:
    uses: port
    gives:
      site: { host: "${hidden.db.host}", port: 443, scheme: https }
  all: { needs: [host-user, box-user, config, both-user, badge] }

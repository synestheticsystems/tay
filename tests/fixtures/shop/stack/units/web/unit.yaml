doc: The shop's site, served by its development server.
needs: [web-port, api]
uses: process
with:
  command: ["serve", "--port", "${web-port.number}"]
  env:
    API_URL: "${api.http.url}"
    LOG: "${settings.log.web}"
ready: { http: "${self.site.url}/", within: 2m }
gives:
  site: { port: "${web-port.number}", scheme: http }

format: 1
stack: ways-names
units:
  server:
    gives: { name: server }
    run:
      source:
        uses: process
        with: { command: [serve] }
        gives:
          http: { port: 8080 }
      image:
        uses: container
        with: { image: example/server }
      remote:
        uses: container
        with: { image: example/remote }
        gives:
          http: { port: 9090 }
up: []

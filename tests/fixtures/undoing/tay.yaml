format: 1
stack: undoing
up: [made]
settings:
  mode: { default: one, doc: "What the undo is given, which a test changes as the unit leaves the plan." }
units:
  token: { uses: secret, with: { kind: password } }
  holder:
    doc: Runs until it is stopped, and says which process it is, so that an undo can tell whether it still runs.
    uses: process
    with:
      command: [sh, -c, "echo $$ > \"$STATE/holder.pid\"; trap 'exit 0' TERM; sleep 3600 & wait"]
      env: { STATE: "${environment.state}" }
  made:
    doc: Makes a file beside the stack, and removes it once it leaves the plan.
    uses: command
    needs: [holder]
    with:
      check: [test, -f, "${environment.root}/made"]
      run: [touch, "${environment.root}/made"]
      undo: ["${environment.root}/undo.sh"]
      when_removed: undo
      env: { MODE: "${settings.mode}", ROOT: "${environment.root}", STATE: "${environment.state}" }
      secret_env: { TOKEN: "${token.value}" }

format: 1
stack: action-errors
up: []
units:
  plain:
    uses: port
    args: { x: {} }
  other:
    uses: port
    gives: { x: "${args.x}" }
  mint:
    uses: command
    action: true
    args: { user: {} }
    with: { run: [mint, "${args.nobody}"] }
  retire:
    uses: command
    action: true
    with: { run: [retire], undo: [restore], when_removed: undo }
